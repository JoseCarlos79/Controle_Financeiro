<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<link rel="manifest" href="manifest.webmanifest">

<meta name="theme-color" content="#ffffff">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#ffffff;--card:#f8f7f2;--ink:#2a2f2d;--mut:#858b87;--line:#e8e6de;--pos:#12c29a;--neg:#f2456f;--ac:#19c8a0;--onac:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums}
#app{max-width:1280px;margin:0 auto;padding:12px 14px 100px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:8px}
small,.mut{color:var(--mut);font-size:12px}.pos{color:var(--pos)}.neg{color:var(--neg)}
.top{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:22px;padding:8px 12px;margin-bottom:14px;position:relative}
.hb{font-size:20px;width:36px;height:36px;text-align:center;color:var(--mut)}.tt{font-weight:600;color:var(--mut);font-size:14px}
.ict{display:none;gap:4px;margin-left:8px}.ict button{width:36px;height:36px;text-align:center;border-radius:10px;color:var(--mut);font-size:16px}.ict button.on{background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac)}
.sp{flex:1}.pill{display:flex;align-items:center;background:var(--ac);color:var(--onac);border-radius:12px;padding:2px 4px;font-weight:600;font-size:13px}
.pill button{color:var(--onac);width:28px;height:30px;text-align:center;font-size:18px}.pill span{text-transform:capitalize;padding:0 4px;white-space:nowrap}
.av{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--mut);display:grid;place-items:center;color:var(--mut);font-size:10px}
.menu{position:absolute;left:8px;top:56px;background:var(--card);box-shadow:0 12px 30px rgba(0,0,0,.18);border-radius:16px;padding:8px;z-index:4;min-width:210px}.menu button{display:block;width:100%;padding:12px 14px;border-radius:10px}.menu button.on{background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac);font-weight:600}
.dash,.pg{display:grid;gap:14px;grid-template-columns:1fr;align-items:start}.dcol{display:grid;gap:14px;align-content:start}
@media(min-width:760px){.dash,.pg{grid-template-columns:1fr 1fr}.pg.one{grid-template-columns:1fr}}
@media(min-width:1080px){.dash{grid-template-columns:repeat(3,1fr)}.ict{display:flex}.hb{display:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}.ct{font-size:12px;color:var(--mut);margin:0 0 12px}
.card>h2:first-child{margin-top:0}h2{font-size:12px;font-weight:500;color:var(--mut);margin:26px 0 10px}
.big{font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.15}.hero{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:2px 0 10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px;text-align:center}.kpis small{display:block}
.thumb{width:104px;height:104px;border-radius:50%;background:color-mix(in srgb,var(--pos) 16%,transparent);display:grid;place-items:center;font-size:42px;margin:4px auto 12px}.thumb.bad{background:color-mix(in srgb,var(--neg) 16%,transparent)}
.lg,.row{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px}
.hbar{height:6px;border-radius:6px;background:var(--line);margin:4px 0 10px;overflow:hidden}.hbar i{display:block;height:100%;background:var(--neg)}
.sl{max-height:250px;overflow:auto}.li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}.d8{width:8px;height:8px;border-radius:50%;background:#3b82e6;flex:none}
.l{display:grid;min-width:0}.l b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.tb{width:100%;border-collapse:collapse}.tb td,.tb th{padding:7px 0;font-size:13px}.tb th{color:var(--mut);font-weight:500;font-size:12px}.tb td+td,.tb th+th{text-align:right}
.cic{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:9px;margin-right:8px;vertical-align:middle}
.link{color:var(--ac);font-weight:600}.mut-l{color:var(--mut)}
.crow,.trow{display:flex;justify-content:space-between;align-items:center;width:100%;padding:11px 0;gap:10px}.v{font-weight:600;white-space:nowrap}
.drawer{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:4px 0 14px}
.drawer input,.drawer select,.q,#bk,.fld input,.fld select{background:transparent;border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--ink);width:100%}.drawer input{width:130px}.drawer select{width:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}.chips button{white-space:nowrap;border:1px solid var(--line);border-radius:99px;padding:6px 14px;color:var(--mut)}.chips button.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.q{margin:4px 0 12px}.day{display:flex;justify-content:space-between;margin:20px 0 2px}.pv{opacity:.7}
.bill{display:flex;align-items:center;gap:14px;padding:12px 0}.bill>div{flex:1}.bill b{font-weight:600}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none}.ck.done{background:var(--pos);border-color:var(--pos)}
details{border-top:1px solid var(--line);padding:14px 0}summary{cursor:pointer;font-weight:600}
.step{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}.step p{margin:4px 0 6px;opacity:.85}
.seg{display:flex;gap:6px}.seg button{flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:9px;color:var(--mut)}.seg button.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.btn{background:var(--ac);color:var(--onac);border-radius:12px;padding:12px 16px;text-align:center;font-weight:600;width:100%}
input[type=range]{width:100%;padding:0;border:0;accent-color:var(--ac)}
.ic{font-size:26px;width:44px;height:44px;text-align:center;color:var(--mut)}h1{font-size:17px;font-weight:600;margin:0}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}.sheet>div{background:var(--bg);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:760px){.sheet{align-items:center}.sheet>div{border-radius:20px}}
.fld{display:grid;gap:10px;margin-top:10px}
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--ac);color:var(--onac);font-size:30px;text-align:center;line-height:56px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:3}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(12px);bottom:90px;width:min(520px,calc(100% - 32px));background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:.25s;z-index:6}#toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.micb{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--ac);color:var(--ac);text-align:center;font-size:17px;flex:none}.rec{background:var(--neg)!important;color:#fff!important;border-color:var(--neg)!important}
.sync{width:28px;height:28px;border-radius:50%;text-align:center;font-size:15px;color:var(--mut);flex:none}.sync.ok{color:var(--pos)}.sync.busy{color:#e0a020}.sync.err,.sync.full{color:var(--neg)}.sync.login{color:#e0a020}
.fab.mic{bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--card);color:var(--ac);border:2px solid var(--ac);font-size:24px;line-height:52px}
@media(max-width:430px){.tt{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="sheet"></div>
<button class="fab mic" onclick="micGo()" aria-label="Lançar por voz" title="Lançar por voz">🎤</button>
<button class="fab" onclick="openSheet()" aria-label="Novo lançamento" title="Novo lançamento">+</button>
<script>
let ref=null,pt=null,syncState='busy',dict=null,dictOn=false,syncWhy='',userEmail='',FB=null,AUTH=null,fbReady=false,unsubFB=null,lastSync=0,tries=0,hideBanner=false;const DEV=Math.random().toString(36).slice(2);
const CATS=['Moradia','Alimentação','Transporte','Lazer','Saúde','Assinaturas','Compras','Financiamentos','Juros e tarifas','Transferências','Outros','Renda','Entre contas'];
const COL=['#14c19a','#3b82e6','#e9d44c','#c44fd0','#f2456f','#ff9f43','#6c7bd9','#8a63d2','#d6402f','#4aa3b8','#9aa5a0','#0f8a5f','#c7ccc9'];
const NEU='Entre contas',EXP=CATS.filter(c=>c!==NEU&&c!=='Renda'),JT='Juros e tarifas';
const ACC=['Bradesco','Itaú','Santander','Cartão C6','Cartão Atacadão','Dinheiro','Outra conta'],CARDS=['Cartão C6','Cartão Atacadão'];
const K='fin-v4';
const $=s=>document.querySelector(s);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const ym=d=>ymd(d).slice(0,7),td=()=>ymd(new Date());
const fmt=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=s=>parseFloat(String(s).replace(',','.'));
const mDate=k=>{const [y,m]=k.split('-').map(Number);return new Date(y,m-1,1)};
const DEF_CFG={ref:'',debts:[],bal:[],cards:[],cara:[],margem:0,balNote:'',taxas:'',hints:{}};
const CF=()=>S.cfg||DEF_CFG;
function seed(){return{tx:[],nid:1,budgets:{},goals:[],bills:[],rules:[],plan:{daily:0,third:0,extra:0,other:0,noint:false},steps:{}}}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.tx)S=seed();
const save=()=>{S.ts=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}schedulePush()};

const KW=[['Renda',/sal[aá]rio|recebi|ganhei/],['Alimentação',/mercado|padaria|ifood|restaurante|lanche|almo[cç]o|jantar|comida|a[cç]ougue|feira|caf[eé]/],['Transporte',/uber|\b99\b|gasolina|combust|posto|estacionamento|[oô]nibus|ped[aá]gio|pneu/],['Moradia',/aluguel|\bluz\b|enel|[aá]gua|condom|internet|claro|g[aá]s|presta[cç][aã]o/],['Saúde',/farm[aá]cia|rem[eé]dio|m[eé]dico|dentista|consulta|exame/],['Lazer',/cinema|\bbar\b|show|viagem|parque|jogo|passeio/],['Assinaturas',/netflix|spotify|prime|assinatura|streaming|globoplay/],['Compras',/roupa|loja|shopee|amazon|presente|sapato/]];
const AK=[[/c6/,'Cartão C6'],[/atacad/,'Cartão Atacadão'],[/ita[uú]/,'Itaú'],[/bradesco/,'Bradesco'],[/santander/,'Santander'],[/dinheiro|esp[eé]cie/,'Dinheiro']];
const STOP=/^(gastei|paguei|comprei|recebi|ganhei|reais|real|r\$|no|na|em|de|do|da|com|ontem|hoje|anteontem|cart[aã]o|um|uma|o|a|e|foi|fiz|usando)$/;
function parseCmd(t){
  const s=t.toLowerCase(),m=s.match(/\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?/);if(!m)return null;
  let v=m[0];v=v.includes(',')?v.replace(/\./g,'').replace(',','.'):(/^\d{1,3}(\.\d{3})+$/.test(v)?v.replace(/\./g,''):v);
  const type=/recebi|ganhei|sal[aá]rio|entrou/.test(s)?'r':'d',dt=new Date();
  if(/anteontem/.test(s))dt.setDate(dt.getDate()-2);else if(/ontem/.test(s))dt.setDate(dt.getDate()-1);
  const cat=(KW.find(k=>k[1].test(s))||[type==='r'?'Renda':'Outros'])[0],acc=(AK.find(k=>k[0].test(s))||[0,'Bradesco'])[1];
  let w=s.split(/\s+/).filter(x=>!STOP.test(x)&&!/\d/.test(x)&&!AK.some(k=>k[0].test(x))).join(' ');
  if(!w)w=cat;return{v:parseFloat(v),type,d:ymd(dt),cat,acc,desc:w.charAt(0).toUpperCase()+w.slice(1)};
}

let view='visao',M=ym(new Date()),fc=null,q='',openCat=null,openTx=null,lastId=null,shown=0,tt,openRule=null,sty='d',menu=false;
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
const inM=k=>S.tx.filter(t=>t.d.startsWith(k));
const sum=(a,ty)=>a.filter(t=>t.type===ty&&t.cat!==NEU).reduce((s,t)=>s+t.val,0);
const spent=(a,c)=>a.filter(t=>t.type==='d'&&t.cat===c).reduce((s,t)=>s+t.val,0);
const prior=c=>{const b=mDate(M);let s=0;for(let i=1;i<=3;i++)s+=spent(inM(ym(new Date(b.getFullYear(),b.getMonth()-i,1))),c);return s/3};
/* Recorrentes e plano */
const T0=()=>ym(new Date()),caraT=()=>CF().cara.reduce((s,x)=>s+x[1],0);
const mdiff=(a,b)=>(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7));
const dim=k=>new Date(+k.slice(0,4),+k.slice(5,7),0).getDate();
const occD=(r,k)=>k+'-'+String(Math.min(r.day,dim(k))).padStart(2,'0');
const act=(r,k)=>{const d=mdiff(r.from,k);return d>=0&&(r.count==null||d<r.count)};
const addM=(k,n)=>ym(new Date(+k.slice(0,4),+k.slice(5,7)-1+n,1));
const pend=k=>S.rules.filter(r=>act(r,k)&&!(r.done||{})[k]).map(r=>({r,d:occD(r,k)})).sort((a,b)=>a.d.localeCompare(b.d));
const mon=k=>mDate(k).toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}).replace('.','');
function conf(id,k){const r=S.rules.find(r=>r.id===id);if(!r)return;S.tx.push({id:uid(),d:occD(r,k),type:r.type,desc:r.n,val:r.v,cat:r.cat,acc:r.acc,rid:r.id});r.done=r.done||{};r.done[k]=1;save();render()}
function skip(id,k){const r=S.rules.find(r=>r.id===id);if(r){r.done=r.done||{};r.done[k]=1;save();render()}}
function pendHTML(){
  if(fc||q)return'';const p=pend(M);if(!p.length)return'';
  return`<h2>Previstos neste mês</h2>${p.map(({r,d})=>`<div class="trow pv" style="flex-wrap:wrap"><span class="l"><b>${esc(r.n)}</b><small>${d.slice(8)}/${d.slice(5,7)} · ${r.cat} · ${r.acc}</small></span><span style="display:flex;gap:12px;align-items:center"><span class="v ${r.type==='r'?'pos':''}">${r.type==='r'?'+':'−'}${fmt(r.v)}</span><button class="link" onclick="conf(${r.id},'${M}')">Confirmar</button><button class="link mut" onclick="skip(${r.id},'${M}')">Pular</button></span></div>`).join('')}<h2>Lançados</h2>`;
}
function projHTML(res){
  const p=pend(M);if(!p.length)return'';
  const i=p.filter(x=>x.r.type==='r').reduce((s,x)=>s+x.r.v,0),o=p.filter(x=>x.r.type==='d').reduce((s,x)=>s+x.r.v,0);
  return`<small style="display:block;margin-top:6px">Ainda previsto: entram ${fmt(i)} e saem ${fmt(o)}. Projeção do mês: <b class="${res+i-o<0?'neg':'pos'}">${fmt(res+i-o)}</b>. <button class="link" onclick="go('plano')">Ver plano</button></small>`;
}
function proj(){
  const P=S.plan,out=[];
  for(let i=1;i<=12;i++){const k=addM(T0(),i);let inc=0,fix=0;
    S.rules.forEach(r=>{if(!act(r,k))return;if(r.type==='r')inc+=r.v;else if(!(P.noint&&r.ev))fix+=r.v});
    out.push({k,inc,fix,s:inc+P.extra-fix-P.daily-P.third-P.other})}
  return out;
}
function simHTML(){
  const pr=proj(),s=pr[0].s,mx=Math.max(1,...pr.map(x=>Math.abs(x.s)));
  const bars=pr.map((x,i)=>{const h=Math.abs(x.s)/mx*55,X=i*24+4;return`<rect x="${X}" y="${x.s>=0?65-h:65}" width="18" height="${Math.max(h,1)}" rx="3" fill="${x.s>=0?'var(--pos)':'var(--neg)'}"/><text x="${X+9}" y="128" font-size="8" text-anchor="middle" fill="var(--mut)">${mon(x.k).slice(0,3)}</text>`}).join('');
  const msg=s<0?`Faltam <b class="neg">${fmt(-s)}</b> por mês. Para sobrar R$ 500, é preciso reduzir ${fmt(500-s)} por mês, somando cortes e renda extra.`:`Sobram <b class="pos">${fmt(s)}</b> por mês.${s>0&&caraT()>0?` Direcionando tudo para a dívida cara (${fmt(caraT())}), ela acaba em cerca de ${Math.ceil(caraT()/s)} meses.`:''}`;
  const ends=S.rules.filter(r=>r.count&&r.count<100&&r.type==='d'&&!r.ev).map(r=>({r,k:addM(r.from,r.count-1)})).sort((a,b)=>a.k.localeCompare(b.k));
  return`<div class="hero ${s<0?'neg':'pos'}" style="font-size:44px">${fmt(s)}</div><small>resultado mensal estimado em ${mon(pr[0].k)}, depois das contas fixas e dos gastos acima</small><p>${msg}</p>
  <svg viewBox="0 0 296 134" width="100%" role="img" aria-label="Resultado mensal estimado nos próximos 12 meses"><line x1="0" x2="296" y1="65" y2="65" stroke="var(--line)"/>${bars}</svg>
  <h2>Quando alivia</h2>${ends.map(e=>`<div class="row"><span>${esc(e.r.n)} termina em ${mon(e.k)}</span><b class="pos">+${fmt(e.r.v)}/mês</b></div>`).join('')}`;
}
function setPlan(k,v){S.plan[k]=k==='noint'?!!v:+v;save();const l=$('#lb-'+k);if(l)l.textContent=fmt(S.plan[k]);$('#simout').innerHTML=simHTML()}
function togStep(id){S.steps[id]=!S.steps[id];save();render()}
function vPlano(){
  const P=S.plan,pr=proj()[0],t0=td(),late=S.bills.filter(b=>b.s==='a'&&b.d<t0),ls=late.reduce((s,b)=>s+b.v,0);
  const j3=[0,1,2].reduce((s,i)=>s+spent(inM(addM(M,-i)),JT),0);
  const top=CATS.filter(c=>c!==NEU&&c!=='Renda').map(c=>({c,v:spent(inM(M),c)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,3);
  const H=Object.assign({daily:'Mercado, comida, transporte e compras. Ajuste conforme o seu mês.',third:'Transferências e PIX para outras pessoas. Se forem compromissos fixos, mantenha; se não, reduzir aqui é o corte mais rápido.',extra:'Renda extra que você espera receber todo mês.',other:'Parcelas de outras dívidas que ainda não estão em Fixos.'},CF().hints||{}),rd=[...new Set(S.rules.filter(r=>r.type==='r').map(r=>r.day))].sort((x,y)=>x-y),dues=[...new Set([...S.rules.filter(r=>r.type==='d'&&!r.ev).map(r=>r.n+' dia '+r.day),...S.bills.filter(x=>x.s!=='p').map(x=>x.n+' dia '+x.d.slice(8))])].slice(0,8);
  const sl=(k,l,mx,h)=>`<div style="margin:16px 0"><div class="row"><span>${l}</span><b id="lb-${k}">${fmt(P[k])}</b></div><input type="range" min="0" max="${mx}" step="50" value="${P[k]}" oninput="setPlan('${k}',this.value)" aria-label="${l}"><small>${h}</small></div>`;
  const steps=[
   ['Pagar o essencial que já venceu',late.length?`${late.length} conta(s) vencida(s) somam ${fmt(ls)}: ${late.map(b=>esc(b.n)).join(', ')}. Moradia, luz e internet vêm primeiro, porque atraso gera multa e risco de corte.`:'Nenhuma conta vencida no momento.','Ver contas',"go('contas')"],
   ['Parar o rotativo e o cheque especial',`Juros e tarifas somaram ${fmt(j3)} nos últimos 3 meses.${caraT()>0?` As dívidas mais caras hoje somam ${fmt(caraT())} (${CF().cara.map(x=>x[0]+' '+fmt(x[1])).join(', ')}).`:''} Todo dinheiro extra vai primeiro para as dívidas com juros mais altos, como rotativo do cartão e cheque especial.`],

const fK=v=>(v<0?'−':'')+(Math.abs(v)>=1000?(Math.abs(v)/1000).toFixed(1).replace('.',',')+' mil':String(Math.round(Math.abs(v))));
const dl=(c,p,up)=>{if(!(p>0))return'<small>&nbsp;</small>';const x=(c-p)/p*100,col=(x>=0)===up?'var(--pos)':'var(--neg)';return`<small style="color:${col};font-weight:600">${x>=0?'▲':'▼'} ${Math.abs(x).toFixed(1).replace('.',',')}% vs mês anterior</small>`};
function fluxo(k){
  const n=dim(k),t0=T0(),tdd=+td().slice(8),m=mt(k),ev=Array(n+2).fill(0);
  m.a.filter(t=>t.cat!==NEU).forEach(t=>{ev[+t.d.slice(8)]+=t.type==='r'?t.val:-t.val});
  m.P.forEach(x=>{ev[+x.d.slice(8)]+=x.r.type==='r'?x.r.v:-x.r.v});
  const vv=(S.plan.daily+S.plan.third+S.plan.other)/n,c=[0];
  for(let i=1;i<=n;i++)c[i]=c[i-1]+ev[i]-((k>t0||(k===t0&&i>tdd))?vv:0);
  const mn=Math.min(0,...c),mx=Math.max(0,...c),sp=(mx-mn)||1,sx=i=>36+(i-1)/(n-1)*258,sy=v=>104-(v-mn)/sp*92;
  const path=c.slice(1).map((v,i)=>(i?'L':'M')+sx(i+1).toFixed(1)+' '+sy(v).toFixed(1)).join(' ');
  const lb=(y,t)=>`<text x="32" y="${y+3}" font-size="8" text-anchor="end" fill="var(--mut)">${t}</text>`;
  const xl=[1,8,15,22,n>28?29:28].map(d=>`<text x="${sx(d)}" y="124" font-size="8" text-anchor="middle" fill="var(--mut)">${String(d).padStart(2,'0')}</text>`).join('');
  const dot=k===t0?`<circle cx="${sx(tdd)}" cy="${sy(c[tdd])}" r="3.5" fill="var(--ac)"/>`:'';
  return{end:c[n],svg:`<svg viewBox="0 0 300 130" width="100%" role="img" aria-label="Fluxo de caixa do mês"><line x1="36" x2="296" y1="${sy(0)}" y2="${sy(0)}" stroke="var(--line)" stroke-dasharray="3 3"/>${mx>0?lb(sy(mx),fK(mx)):''}${lb(sy(0),'0')}${mn<0?lb(sy(mn),fK(mn)):''}<path d="${path}" fill="none" stroke="var(--ac)" stroke-width="1.8" stroke-linejoin="round"/>${dot}${xl}</svg>`};
}

  return need;
}
function syncNow(){
  if(!ref){if(syncState==='login'){signIn();return}tries=0;initSync();return}
  setSync('busy');
  ref.get().then(s=>{const d=s.exists?s.data():null;if(d&&d.json)applyRemote(d);return push()}).catch(e=>{syncWhy='erro: '+((e&&e.code)||'');setSync('err')});
}
function syncBanner(){
  if(syncState==='ok'||syncState==='busy'||hideBanner)return'';
  const login=syncState==='login';
  return`<div class="card" style="margin-bottom:14px;border-color:var(--${login?'ac':'neg'})"><b>☁ ${login?'Entre para sincronizar':'Sem sincronização neste aparelho'}</b><p class="mut" style="margin:6px 0 10px;font-size:13px">${esc(login?SYNCT.login:(syncWhy||SYNCT[syncState]))}</p><div style="display:flex;gap:16px;flex-wrap:wrap">${login?'<button class="link" onclick="signIn()">Entrar com Google</button>':'<button class="link" onclick="syncNow()">Tentar de novo</button>'}<button class="link mut-l" onclick="hideBanner=true;render()">Ocultar</button></div></div>`;
}
try{hideBanner=localStorage.getItem('fin-nosync-hide')==='1'}catch(e){}
setInterval(()=>{if(!ref&&tries<8)initSync()},20000);
if(document.addEventListener)document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState!=='visible')return;
  if(!ref){initSync();return}
  try{const s=await ref.get();if(s.exists){const d=s.data();if(d&&d.json&&applyRemote(d))schedulePush()}}catch(e){}
});
let zeroBak=null;
function askZero(){
  const sm=l=>l.reduce((s,t)=>s+t.val,0),a=S.tx.filter(t=>t.type==='d'&&t.d.startsWith(M)),all=S.tx.filter(t=>t.type==='d');
  $('#sheet').innerHTML=`<div class="sheet" onclick="if(event.target===this)closeSheet()"><div role="dialog" aria-label="Zerar gastos"><div class="row"><h1>Zerar gastos</h1><button class="ic" onclick="closeSheet()" aria-label="Fechar">×</button></div><p class="mut">Escolha o que apagar. As receitas, os fixos e as parcelas previstas continuam. Você poderá desfazer logo depois.</p><div class="fld"><button class="btn" style="background:var(--neg)" onclick="doZero('m')">Zerar gastos de ${mon(M)} (${a.length} itens, ${fmt(sm(a))})</button><button class="btn" style="background:var(--neg)" onclick="doZero('a')">Zerar todos os gastos (${all.length} itens, ${fmt(sm(all))})</button><button class="link" style="text-align:center;padding:8px" onclick="closeSheet()">Cancelar</button></div></div></div>`;
}
function doZero(w){
  const sel=S.tx.filter(t=>t.type==='d'&&(w==='a'||t.d.startsWith(M))),t=$('#toast');
  if(!sel.length){closeSheet();toast('Não há gastos para zerar.');return}
  zeroBak=sel.map(x=>({...x}));const ids=new Set(sel.map(x=>x.id));
  S.del=(S.del||[]).concat([...ids]);S.tx=S.tx.filter(x=>!ids.has(x.id));save();closeSheet();render();
  t.innerHTML=`<div>${sel.length} gasto(s) zerado(s).</div><span><button class="link" onclick="undoZero()">Desfazer</button></span>`;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),10000);
}
function undoZero(){if(!zeroBak)return;zeroBak.forEach(x=>S.tx.push({...x,id:uid()}));zeroBak=null;save();$('#toast').classList.remove('show');render()}
function delTx(id){S.del=(S.del||[]).concat([id]);S.tx=S.tx.filter(t=>t.id!==id);save();render()}
function reset(demo){
  const del=(S.del||[]).concat(S.tx.map(t=>t.id));
  S=demo?seed():{tx:[],nid:1,budgets:{},goals:[],bills:[],rules:[],plan:{daily:0,third:0,extra:0,other:0,noint:false},steps:{}};
  if(demo)S.tx.forEach(t=>{t.id=uid()});S.del=del;S.est=1;save();render();
}

function welcome(){return(!S.tx.length&&!S.rules.length)?`<div class="card" style="margin-bottom:14px"><b>Bem-vindo!</b><p class="mut" style="margin:6px 0 0;font-size:13px">Comece tocando em <b>+</b> para lançar um gasto ou uma entrada. Para trazer os dados do outro app: abra o app antigo, vá em Contas, toque em Gerar código e copie. Aqui, vá em Contas, cole o código e toque em Carregar código.</p></div>`:''}

function importFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#bk').value=String(r.result);importCode()};r.readAsText(f)}

render();
initSync();initDict();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
